[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-oart-automated-contouring"
version = "1.1.0"
description = "Statistical analysis and data-based figures for online adaptive radiotherapy contouring"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "matplotlib>=3.9,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
imaging = ["SimpleITK>=2.3,<3", "pydicom>=3,<4", "rt-utils>=1.2.7,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
npc-oart-automated-contouring = "oart_analysis.cli:main"

[tool.setuptools.packages.find]
include = ["oart_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.package-data]
oart_analysis = ["data/*.csv", "data/*.json", "data/*.md"]
